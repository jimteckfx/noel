<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pige de Noël</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --nuit: #0e2a22; --nuit2: #163d31; --carte: #fffdf8; --texte: #2a2420; --doux: #7a6f66;
    --rouge: #c0272d; --rouge2: #8f1b20; --vert: #1f6b4a; --or: #e8b931; --ligne: #eadfcf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--texte);
    font: 16px/1.5 "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at top, var(--nuit2), var(--nuit) 70%) fixed, var(--nuit);
    overflow-x: hidden;
  }
  #neige { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .sapins { position: fixed; left: 0; right: 0; bottom: 0; height: 130px; pointer-events: none; z-index: 0; }
  .sapins svg { width: 100%; height: 100%; display: block; }

  .page { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 0 16px 170px; }

  /* Guirlande */
  .guirlande { position: absolute; top: 0; left: 0; right: 0; height: 46px; z-index: 2; pointer-events: none; }
  .guirlande svg.fil { position: absolute; inset: 0; width: 100%; height: 100%; }
  .guirlande i { position: absolute; width: 13px; height: 20px; margin-left: -6.5px;
                 border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
                 transform-origin: 50% -6px; animation: allume 2.4s ease-in-out infinite, oscille 3s ease-in-out infinite; }
  .guirlande i::before { content: ""; position: absolute; top: -6px; left: 3px; width: 7px; height: 7px;
                         background: #3a3a3a; border-radius: 2px; }
  .guirlande i.r { background: #ff3b3b; color: #ff3b3b; }
  .guirlande i.o { background: #ffd23f; color: #ffd23f; }
  .guirlande i.b { background: #3fb6ff; color: #3fb6ff; }
  .guirlande i.v { background: #4cff8f; color: #4cff8f; }
  @keyframes allume {
    0%, 100% { opacity: .3; box-shadow: none; filter: saturate(.6); }
    45%, 60% { opacity: 1; box-shadow: 0 0 10px 3px currentColor, 0 0 22px 6px currentColor; filter: none; }
  }
  @keyframes oscille { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .page { padding-top: 46px; }

  /* Traîneau */
  #traineau { position: fixed; top: 78px; left: 0; width: 300px; z-index: 0; pointer-events: none;
              animation: vole 22s linear infinite; }
  #traineau .flotte { animation: flotte 2.2s ease-in-out infinite; }
  #traineau .patte { transform-box: fill-box; transform-origin: 50% 0; animation: galop .5s ease-in-out infinite alternate; }
  #traineau .patte.b { animation-delay: .25s; }
  #traineau .etincelle { animation: scintille 1s ease-in-out infinite; }
  @media (max-width: 600px) { #traineau { width: 170px; top: 52px; } }
  .sous { text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  @keyframes vole {
    0% { transform: translateX(-340px) translateY(40px) rotate(-4deg); }
    50% { transform: translateX(50vw) translateY(-10px) rotate(-2deg); }
    100% { transform: translateX(calc(100vw + 40px)) translateY(30px) rotate(3deg); }
  }
  @keyframes flotte { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes galop { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
  @keyframes scintille { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

  .entete { display: flex; align-items: center; gap: 14px; margin: 6px 0 22px; color: #fff; }
  .entete svg { flex: 0 0 auto; width: 88px; height: 88px; animation: balance 3s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes balance { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  h1 { font-family: "Mountains of Christmas", cursive; font-size: 40px; line-height: 1.1; margin: 0;
       color: #fff; text-shadow: 0 2px 0 var(--rouge2), 0 0 18px rgba(232,185,49,.35); }
  h1 span { color: var(--or); }
  .sous { color: #d7e8de; margin: 2px 0 0; font-weight: 600; }

  .carte { position: relative; background: var(--carte); border-radius: 18px; padding: 20px 18px 18px;
           margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
           border-top: 6px solid var(--rouge); }
  .carte::after { content: ""; position: absolute; top: -14px; right: 18px; width: 26px; height: 26px;
                  background: radial-gradient(circle at 35% 35%, #ff6b6b, var(--rouge) 60%, var(--rouge2));
                  border-radius: 50%; box-shadow: 0 0 0 3px var(--or) inset; }
  .carte h2 { font-size: 18px; margin: 0 0 10px; font-weight: 800; }
  .pige { border-top-color: var(--vert);
          background: linear-gradient(135deg, #fffdf8 0%, #f2fbf5 100%); }
  .pige::after { background: radial-gradient(circle at 35% 35%, #7fe0a3, var(--vert) 60%, #0f3d29); }
  .pige .nom { font-family: "Mountains of Christmas", cursive; font-size: 42px; line-height: 1.1; color: var(--vert); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; gap: 10px; align-items: center; justify-content: space-between;
       padding: 10px 0; border-top: 1px dashed var(--ligne); }
  li:first-child { border-top: 0; }
  li > div:first-child::before { content: "🎁 "; }
  li a { color: var(--vert); font-size: 14px; font-weight: 600; }
  .vide { color: var(--doux); font-style: italic; }
  form { display: grid; gap: 8px; margin-top: 14px; }
  input { width: 100%; padding: 11px 12px; border: 1.5px solid var(--ligne); border-radius: 12px;
          font: inherit; background: #fff; }
  input:focus { outline: none; border-color: var(--or); box-shadow: 0 0 0 3px rgba(232,185,49,.25); }
  button { padding: 11px 16px; border: 0; border-radius: 12px; font: inherit; font-weight: 800;
           color: #fff; cursor: pointer;
           background: repeating-linear-gradient(-45deg, var(--rouge) 0 12px, #d8383e 12px 24px); }
  button:hover { filter: brightness(1.08); }
  button.sec { background: transparent; color: var(--doux); border: 1.5px solid var(--ligne);
               padding: 6px 10px; font-weight: 600; font-size: 14px; }
  button:disabled { opacity: .5; cursor: default; }
  .rangee { display: flex; gap: 8px; flex-wrap: wrap; }
  .lien { font-size: 13px; color: var(--doux); word-break: break-all; }
  .msg { padding: 10px 12px; border-radius: 12px; background: #fdecea; color: var(--rouge2);
         margin-bottom: 16px; display: none; font-weight: 600; }
  .photo { display: block; width: 110px; height: 110px; object-fit: cover; border-radius: 12px;
           margin: 8px 0 4px; cursor: zoom-in; border: 1px solid var(--ligne); background: #fff; }
  .photo.grande { width: 100%; height: auto; max-height: 70vh; object-fit: contain; cursor: zoom-out; }
  .photo.apercu { display: none; margin: 0; cursor: default; }
  .photo-btn { justify-self: start; }
  .cadeau { min-width: 0; flex: 1; }
  .note { font-size: 14px; color: var(--doux); margin-top: 0; }
  #app > .sous:only-child { padding-top: 40px; }
  @media (prefers-reduced-motion: reduce) { .entete svg, .guirlande i, #traineau, #traineau * { animation: none !important; } #traineau { display: none; } .guirlande i { opacity: 1; } }
</style>
</head>
<body>
<canvas id="neige"></canvas>

<div class="sapins" aria-hidden="true">
  <svg viewBox="0 0 1200 130" preserveAspectRatio="xMidYMax slice">
    <defs>
      <g id="sapin">
        <polygon points="0,-90 28,-50 16,-50 40,-18 24,-18 52,18 -52,18 -24,-18 -40,-18 -16,-50 -28,-50" />
        <rect x="-7" y="18" width="14" height="14" fill="#4a2e1d"/>
      </g>
    </defs>
    <path d="M0 105 Q300 80 600 100 T1200 95 V130 H0Z" fill="#f4f8fb"/>
    <g fill="#13402e">
      <use href="#sapin" transform="translate(60 92) scale(.8)"/>
      <use href="#sapin" transform="translate(150 98) scale(1.05)"/>
      <use href="#sapin" transform="translate(1040 96) scale(1)"/>
      <use href="#sapin" transform="translate(1130 92) scale(.75)"/>
      <use href="#sapin" transform="translate(410 100) scale(.6)"/>
      <use href="#sapin" transform="translate(780 98) scale(.7)"/>
    </g>
    <g fill="#1f6b4a">
      <use href="#sapin" transform="translate(105 104) scale(.7)"/>
      <use href="#sapin" transform="translate(1085 104) scale(.65)"/>
    </g>
    <g fill="#e8b931">
      <circle cx="150" cy="7" r="5"/><circle cx="1040" cy="6" r="5"/>
    </g>
    <path d="M0 112 Q300 92 600 110 T1200 106 V130 H0Z" fill="#ffffff"/>
  </svg>
</div>

<div class="guirlande" id="guirlande" aria-hidden="true"></div>

<!-- Père Noël en traîneau avec ses rennes (dessin original) -->
<div id="traineau" aria-hidden="true">
  <svg class="flotte" viewBox="0 0 300 90">
    <defs>
      <g id="renne">
        <line class="patte"   x1="-12" y1="6" x2="-14" y2="24" stroke="#5a3a22" stroke-width="3" stroke-linecap="round"/>
        <line class="patte b" x1="-6"  y1="6" x2="-8"  y2="24" stroke="#4a2e1a" stroke-width="3" stroke-linecap="round"/>
        <line class="patte b" x1="10"  y1="6" x2="12"  y2="24" stroke="#5a3a22" stroke-width="3" stroke-linecap="round"/>
        <line class="patte"   x1="15"  y1="6" x2="17"  y2="24" stroke="#4a2e1a" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="0" cy="0" rx="20" ry="10" fill="#8b5a33"/>
        <ellipse cx="-2" cy="4" rx="12" ry="5" fill="#c99a6b"/>
        <path d="M14 -4 Q20 -14 24 -18" stroke="#8b5a33" stroke-width="8" stroke-linecap="round" fill="none"/>
        <ellipse cx="29" cy="-20" rx="8" ry="6" fill="#8b5a33"/>
        <circle cx="36" cy="-19" r="2.6" fill="#2a1a10"/>
        <circle cx="29" cy="-22" r="1.4" fill="#111"/>
        <path d="M25 -25 L22 -36 M23 -31 L18 -34 M22 -36 L24 -41 M28 -25 L31 -36 M30 -32 L35 -35 M31 -36 L29 -41"
              stroke="#d9b98a" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M-20 -2 L-25 -6" stroke="#8b5a33" stroke-width="4" stroke-linecap="round"/>
      </g>
    </defs>
    <!-- étincelles -->
    <g fill="#ffe27a">
      <circle class="etincelle" cx="8" cy="64" r="2"/>
      <circle class="etincelle" cx="22" cy="54" r="1.6" style="animation-delay:.3s"/>
      <circle class="etincelle" cx="34" cy="68" r="1.4" style="animation-delay:.6s"/>
      <circle class="etincelle" cx="48" cy="58" r="1.8" style="animation-delay:.15s"/>
    </g>
    <!-- harnais -->
    <path d="M112 58 Q150 50 180 50 Q215 48 250 46" stroke="#e8b931" stroke-width="1.6" fill="none"/>
    <!-- rennes -->
    <use href="#renne" transform="translate(180 50) scale(.75)"/>
    <use href="#renne" transform="translate(240 44) scale(.75)"/>
    <!-- traîneau -->
    <path d="M58 70 Q60 80 74 80 L122 80 Q130 80 132 74" stroke="#e8b931" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="72" y1="66" x2="74" y2="79" stroke="#e8b931" stroke-width="2.5"/>
    <line x1="112" y1="66" x2="114" y2="79" stroke="#e8b931" stroke-width="2.5"/>
    <path d="M56 40 Q54 66 70 68 L118 68 Q126 66 128 54 L118 54 Q108 54 104 46 L60 46 Z" fill="#c0272d"/>
    <path d="M60 46 L104 46" stroke="#e8b931" stroke-width="2.5"/>
    <!-- sac de cadeaux -->
    <path d="M58 46 Q52 26 66 22 Q78 20 80 32 Q82 42 76 46Z" fill="#7a4a2a"/>
    <rect x="60" y="30" width="9" height="9" fill="#3fb6ff"/><rect x="69" y="27" width="8" height="8" fill="#4cff8f"/>
    <!-- Père Noël -->
    <path d="M82 46 Q80 28 92 26 Q104 26 104 46Z" fill="#c0272d"/>
    <rect x="82" y="38" width="22" height="4" fill="#2a2420"/>
    <circle cx="93" cy="20" r="7" fill="#f6c9a8"/>
    <path d="M86 22 Q93 34 100 22 Q97 26 93 26 Q89 26 86 22Z" fill="#fff"/>
    <path d="M85 17 Q90 6 102 10 L106 18Z" fill="#c0272d"/>
    <rect x="85" y="15" width="16" height="4" rx="2" fill="#fff"/>
    <circle cx="107" cy="18" r="3" fill="#fff"/>
    <path d="M101 34 Q112 40 120 50" stroke="#c0272d" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M120 50 L150 54" stroke="#e8b931" stroke-width="1.4"/>
  </svg>
</div>

<div class="page">
  <div class="entete">
    <!-- Père Noël maison -->
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M22 44 Q30 8 62 10 Q86 12 84 40 Z" fill="#c0272d"/>
      <path d="M62 10 Q86 4 92 24" stroke="#c0272d" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle cx="92" cy="27" r="7" fill="#fff"/>
      <ellipse cx="53" cy="56" rx="24" ry="20" fill="#f6c9a8"/>
      <rect x="18" y="38" width="70" height="12" rx="6" fill="#fff"/>
      <circle cx="44" cy="57" r="3" fill="#2a2420"/><circle cx="62" cy="57" r="3" fill="#2a2420"/>
      <circle cx="38" cy="65" r="4" fill="#f2a08a" opacity=".7"/><circle cx="68" cy="65" r="4" fill="#f2a08a" opacity=".7"/>
      <path d="M26 66 Q28 98 53 98 Q78 98 80 66 Q72 74 53 72 Q34 74 26 66Z" fill="#fff"/>
      <path d="M40 70 Q53 64 66 70 Q60 76 53 74 Q46 76 40 70Z" fill="#fff" stroke="#e5e5e5"/>
      <circle cx="53" cy="65" r="5" fill="#e98a74"/>
      <path d="M47 82 Q53 86 59 82" stroke="#c98" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <div id="titre"></div>
  </div>
  <div id="app"><p class="sous">Chargement…</p></div>
</div>

<script>
  // ⚠️ Colle ici l'URL de ton déploiement Apps Script (se termine par /exec).
  const API_URL = 'https://script.google.com/macros/s/AKfycbx-iCtQCnSNKKYp-fOVZIw26FCeYBfxHw0Uj7W5sAxNhM2m9JF4fHpsnGLhHffhAPMG/exec';

  const params = new URLSearchParams(location.search);
  const JETON = params.get('t') || '';
  const ADMIN = params.get('admin') || '';
  const app = document.getElementById('app');
  const titre = document.getElementById('titre');

  // Le titre et le sous-titre vont dans l'en-tête à côté du Père Noël.
  function afficher(...noeuds) {
    const t = noeuds.filter(n => n instanceof Node && (n.tagName === 'H1' || (n.classList && n.classList.contains('sous'))));
    titre.replaceChildren(...t);
    app.replaceChildren(...noeuds.filter(n => !t.includes(n)));
  }

  function el(tag, attrs, ...enfants) {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === 'on') Object.entries(v).forEach(([e, f]) => n.addEventListener(e, f));
      else if (k === 'class') n.className = v;
      else n.setAttribute(k, v);
    });
    enfants.flat().forEach(c => n.append(c instanceof Node ? c : document.createTextNode(c ?? '')));
    return n;
  }

  // Correspondance des arguments pour chaque action de l'API.
  const ARGS = {
    moi: ['jeton'], ajouterCadeau: ['jeton', 'texte', 'lien', 'photo'], retirerCadeau: ['jeton', 'id'],
    etatAdmin: ['cle'], ajouterPersonne: ['cle', 'nom'], retirerPersonne: ['cle', 'jeton'],
    piger: ['cle'], reinitialiserPige: ['cle']
  };

  async function appel(fn, ...args) {
    const corps = { action: fn };
    ARGS[fn].forEach((k, i) => corps[k] = args[i]);
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // évite le preflight CORS
      body: JSON.stringify(corps)
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.erreur || 'Erreur');
    return j.data;
  }

  function erreur(e) {
    const m = document.querySelector('.msg');
    if (m) { m.textContent = e.message || e; m.style.display = 'block'; }
    else alert(e.message || e);
  }

  function listeCadeaux(cadeaux, retirer) {
    if (!cadeaux.length) return el('p', { class: 'vide' }, 'Aucun cadeau pour l’instant.');
    return el('ul', {}, cadeaux.map(c => el('li', {},
      el('div', { class: 'cadeau' },
        c.texte || (c.photo ? 'Photo' : ''),
        c.photo ? el('img', { class: 'photo', src: c.photo, alt: c.texte || 'Photo du cadeau',
                              on: { click: e => e.currentTarget.classList.toggle('grande') } }) : '',
        c.lien ? el('div', {}, el('a', { href: c.lien, target: '_blank', rel: 'noopener' }, 'Voir le lien')) : ''),
      retirer ? el('button', { class: 'sec', on: { click: () => retirer(c.id) } }, 'Retirer') : ''
    )));
  }

  /* ---------- Vue participant ---------- */
  function vuePerso(d) {
    afficher(
      el('h1', {}, 'Pige de Noël ', el('span', {}, '🎁')),
      el('p', { class: 'sous' }, 'Bonjour ' + d.nom + ' !'),
      el('div', { class: 'msg' }),
      d.pigeFaite && d.pige
        ? el('div', { class: 'carte pige' },
            el('h2', {}, 'Tu as pigé'),
            el('div', { class: 'nom' }, d.pige.nom),
            el('p', { class: 'note' }, 'Sa liste, mise à jour en direct. Garde le secret !'),
            listeCadeaux(d.pige.cadeaux, null))
        : el('div', { class: 'carte' }, el('h2', {}, 'La pige n’est pas encore faite'),
            el('p', { class: 'note' }, 'Reviens sur ce lien plus tard pour savoir qui tu as pigé.')),
      el('div', { class: 'carte' },
        el('h2', {}, 'Ma liste de souhaits'),
        el('p', { class: 'note' }, 'Seule la personne qui t’a pigé verra cette liste.'),
        listeCadeaux(d.mesCadeaux, id => appel('retirerCadeau', JETON, id).then(vuePerso).catch(erreur)),
        formAjout())
    );
  }

  // Réduit la photo jusqu'à ce qu'elle tienne dans une cellule de la Sheet (~48 000 caractères).
  function compresser(fichier) {
    return new Promise((ok, ko) => {
      const img = new Image();
      img.onload = () => {
        let max = 720, q = 0.8, url = '';
        const c = document.createElement('canvas');
        for (let essai = 0; essai < 12; essai++) {
          const r = Math.min(1, max / Math.max(img.width, img.height));
          c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
          x.drawImage(img, 0, 0, c.width, c.height);
          url = c.toDataURL('image/jpeg', q);
          if (url.length <= 48000) return ok(url);
          if (q > 0.5) q -= 0.1; else max = Math.round(max * 0.8);
        }
        ko(new Error('Photo trop lourde, essaie une autre image.'));
      };
      img.onerror = () => ko(new Error('Impossible de lire cette image.'));
      img.src = URL.createObjectURL(fichier);
    });
  }

  function formAjout() {
    let photo = '';
    const texte = el('input', { placeholder: 'Idée de cadeau', maxlength: '200' });
    const lien = el('input', { placeholder: 'Lien (optionnel)', maxlength: '500' });
    const apercu = el('img', { class: 'photo apercu', alt: '' });
    const choix = el('input', { type: 'file', accept: 'image/*', hidden: '' });
    const btnPhoto = el('button', { type: 'button', class: 'sec photo-btn', on: { click: () => choix.click() } }, '📷 Ajouter une photo');
    const btn = el('button', { type: 'submit' }, 'Ajouter');
    choix.addEventListener('change', async () => {
      const f = choix.files[0]; if (!f) return;
      btnPhoto.textContent = 'Préparation…';
      try {
        photo = await compresser(f);
        apercu.src = photo; apercu.style.display = 'block';
        btnPhoto.textContent = '📷 Changer la photo';
      } catch (e) { photo = ''; btnPhoto.textContent = '📷 Ajouter une photo'; erreur(e); }
      choix.value = '';
    });
    return el('form', { on: { submit: e => {
      e.preventDefault();
      if (!texte.value.trim() && !photo) return erreur(new Error('Écris une idée ou ajoute une photo.'));
      btn.disabled = true;
      appel('ajouterCadeau', JETON, texte.value, lien.value, photo).then(vuePerso).catch(e => { btn.disabled = false; erreur(e); });
    } } }, texte, lien, choix, btnPhoto, apercu, btn);
  }

  /* ---------- Vue admin ---------- */
  function vueAdmin(d) {
    const nom = el('input', { placeholder: 'Nom (ex. Caro)', maxlength: '60', required: '' });
    afficher(
      el('h1', {}, 'Pige de Noël ', el('span', {}, '· admin')),
      el('p', { class: 'sous' }, d.tire ? 'La pige est faite. Envoie à chacun son lien.' : 'Ajoute tout le monde, puis lance la pige.'),
      el('div', { class: 'msg' }),
      el('div', { class: 'carte' },
        el('h2', {}, 'Participants (' + d.personnes.length + ')'),
        d.personnes.length ? el('ul', {}, d.personnes.map(p => el('li', {},
          el('div', {}, el('strong', {}, p.nom), el('div', { class: 'lien' }, p.lien)),
          el('div', { class: 'rangee' },
            el('button', { class: 'sec', on: { click: () => navigator.clipboard.writeText(p.lien).then(() => alert('Lien de ' + p.nom + ' copié')) } }, 'Copier'),
            d.tire ? '' : el('button', { class: 'sec', on: { click: () => appel('retirerPersonne', ADMIN, p.jeton).then(vueAdmin).catch(erreur) } }, '✕'))
        ))) : el('p', { class: 'vide' }, 'Personne encore.'),
        d.tire ? '' : el('form', { on: { submit: e => {
          e.preventDefault();
          appel('ajouterPersonne', ADMIN, nom.value).then(vueAdmin).catch(erreur);
        } } }, nom, el('button', { type: 'submit' }, 'Ajouter'))
      ),
      el('div', { class: 'carte' },
        el('h2', {}, 'Pige'),
        el('p', { class: 'note' }, 'Personne ne se pige soi-même. Les résultats ne s’affichent jamais ici, même pour toi.'),
        el('div', { class: 'rangee' },
          d.tire
            ? el('button', { class: 'sec', on: { click: () => confirm('Refaire la pige ? Tout le monde aura une nouvelle personne.') && appel('reinitialiserPige', ADMIN).then(vueAdmin).catch(erreur) } }, 'Réinitialiser la pige')
            : el('button', { on: { click: () => appel('piger', ADMIN).then(vueAdmin).catch(erreur) } }, 'Lancer la pige')))
    );
  }

  /* ---------- Démarrage ---------- */
  if (ADMIN) appel('etatAdmin', ADMIN).then(vueAdmin).catch(e => afficher(el('p', { class: 'sous' }, e.message)));
  else if (JETON) appel('moi', JETON).then(vuePerso).catch(e => afficher(el('p', { class: 'sous' }, e.message)));
  else afficher(el('h1', {}, 'Pige de Noël 🎁'), el('p', { class: 'sous' }, 'Utilise le lien personnel qu’on t’a envoyé.'));

  /* ---------- Guirlande ---------- */
  (function () {
    const g = document.getElementById('guirlande');
    const couleurs = ['r', 'o', 'b', 'v'];
    function construire() {
      const w = innerWidth, pas = 44, n = Math.ceil(w / pas) + 1;
      // fil qui pend entre les ampoules
      let d = 'M0 6';
      for (let i = 0; i < n; i++) d += ` Q${i * pas + pas / 2} 22 ${(i + 1) * pas} 6`;
      g.innerHTML = `<svg class="fil" viewBox="0 0 ${w} 46" preserveAspectRatio="none"><path d="${d}" stroke="#2f5e45" stroke-width="2.5" fill="none"/></svg>`;
      for (let i = 0; i < n; i++) {
        const b = document.createElement('i');
        b.className = couleurs[i % 4];
        b.style.left = (i * pas + pas / 2) + 'px';
        b.style.top = '19px';
        // vague de lumière qui parcourt la guirlande
        b.style.animationDelay = (i * 0.12) % 2.4 + 's, ' + (i % 2 ? '-1.5s' : '0s');
        g.append(b);
      }
    }
    construire(); addEventListener('resize', construire);
  })();

  /* ---------- Neige ---------- */
  (function () {
    const c = document.getElementById('neige'), x = c.getContext('2d');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let w, h, flocons = [];
    function taille() {
      w = c.width = innerWidth; h = c.height = innerHeight;
      const n = Math.min(160, Math.round(w * h / 9000));
      flocons = Array.from({ length: n }, () => ({
        x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2.6 + .8,
        v: Math.random() * .7 + .3, d: Math.random() * Math.PI * 2
      }));
    }
    function boucle() {
      x.clearRect(0, 0, w, h); x.fillStyle = 'rgba(255,255,255,.85)'; x.beginPath();
      for (const f of flocons) {
        f.y += f.v; f.d += .01; f.x += Math.sin(f.d) * .4;
        if (f.y > h) { f.y = -5; f.x = Math.random() * w; }
        x.moveTo(f.x, f.y); x.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      }
      x.fill(); requestAnimationFrame(boucle);
    }
    addEventListener('resize', taille); taille(); boucle();
  })();
</script>
</body>
</html>
